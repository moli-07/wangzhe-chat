<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131a">
  <title>峡谷开黑群</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #f3c979;
      --ink: #20202a;
      --panel: #17151de8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #fff;
      background: radial-gradient(ellipse at center, #39302d, #12121a 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .phone {
      position: relative;
      isolation: isolate;
      width: min(100%, 500px);
      height: min(880px, calc(100vh - 40px));
      min-height: 600px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #f3c97970;
      border-radius: 26px;
      background: #1c1820;
      box-shadow: 0 22px 80px #000a;
    }

    /* 使用项目内图片作为聊天背景，文件路径需保持为 assets/IMG_5894.JPG */
    .phone::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background: url("assets/IMG_5894.JPG") center 32% / cover no-repeat;
    }

    .phone::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(180deg, #14131dcc 0%, #17131a55 25%, #15121a82 72%, #12121aeF 100%);
    }

    .topbar, .notice, .chat, .composer { position: relative; z-index: 1; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 13px;
      background: #15141be8;
      border-bottom: 1px solid #f3c97945;
    }

    .back { color: var(--gold); font-size: 28px; line-height: 1; }
    .group-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid #ffe0a2;
      border-radius: 12px;
      background: linear-gradient(145deg, #f4ce7e, #9c4929);
      font-size: 21px;
    }
    .group-name { flex: 1; }
    .group-name strong { font-size: 15px; }
    .group-name small { display: block; margin-top: 3px; color: #c4bdc5; font-size: 11px; }
    .more { color: #eadfca; letter-spacing: 3px; }

    .notice {
      margin: 11px 13px 0;
      padding: 8px 11px;
      border: 1px solid #efc97966;
      border-radius: 9px;
      background: #211b1de8;
      color: #f5dba8;
      font-size: 11px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px 14px 18px;
      scrollbar-color: #d4a65b88 transparent;
      scrollbar-width: thin;
    }

    .time, .ending {
      margin: 4px 0 16px;
      color: #f1e6d1c9;
      text-align: center;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 0 0 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .message.show { opacity: 1; transform: translateY(0); }

    .avatar {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border: 1px solid #f7d99e;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0008;
      font-size: 21px;
    }
    .a1 { background: linear-gradient(145deg, #54362e, #db7840); }
    .a2 { background: linear-gradient(145deg, #314b6d, #7492cb); }
    .a3 { background: linear-gradient(145deg, #684467, #c983ad); }
    .a4 { background: linear-gradient(145deg, #47553c, #a3b96d); }
    .a5 { background: linear-gradient(145deg, #594335, #c89a5a); }
    .a6 { background: linear-gradient(145deg, #493858, #a889c9); }
    .a7 { background: linear-gradient(145deg, #315052, #64a996); }

    .message-content { max-width: calc(100% - 48px); }
    .sender { margin: 0 0 5px 2px; color: #f2d59f; font-size: 11px; text-shadow: 0 1px 5px #000; }
    .sender small { margin-left: 4px; color: #e0d4c0; font-size: 9px; }
    .bubble {
      position: relative;
      padding: 9px 12px;
      border-radius: 4px 12px 12px;
      background: #f6f3ed;
      color: var(--ink);
      box-shadow: 0 3px 9px #0008;
      font-size: 13px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .bubble::before {
      content: "";
      position: absolute;
      top: 0;
      left: -5px;
      border-top: 0 solid transparent;
      border-right: 6px solid #f6f3ed;
      border-bottom: 6px solid transparent;
    }

    .right { justify-content: flex-end; }
    .right .avatar { order: 2; }
    .right .message-content { order: 1; text-align: right; }
    .right .sender { margin-right: 2px; }
    .right .bubble { border-radius: 12px 4px 12px 12px; background: #f2d28d; text-align: left; }
    .right .bubble::before { right: -5px; left: auto; border-right: 0; border-left: 6px solid #f2d28d; }

    .ending { margin: 19px 0 8px; color: #f4d491; }
    .composer {
      padding: 12px 14px 15px;
      border-top: 1px solid #f3c97945;
      background: #15141bf2;
    }
    .composer-row { display: flex; align-items: center; gap: 9px; }
    .icon { color: #e8ddca; font-size: 20px; }
    .input {
      flex: 1;
      min-width: 0;
      padding: 9px 13px;
      border: 1px solid #ffffff30;
      border-radius: 18px;
      color: #bbb6be;
      background: #ffffff0d;
      font-size: 12px;
    }
    button {
      padding: 9px 13px;
      border: 0;
      border-radius: 12px;
      color: #261d12;
      background: linear-gradient(135deg, #f5d895, #dca14d);
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .caption { margin-top: 8px; color: #d9c69e99; text-align: center; font-size: 9px; letter-spacing: .1em; }

    @media (max-width: 560px) {
      body { min-height: 100dvh; padding: 0; }
      .phone { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; }
      .phone::before { background-position: 55% 30%; }
      .topbar { padding-top: max(14px, env(safe-area-inset-top)); }
      .composer { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .bubble { font-size: 12.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="王者荣耀风格群聊">
    <header class="topbar">
      <span class="back" aria-hidden="true">‹</span>
      <div class="group-icon" aria-hidden="true">⚔</div>
      <div class="group-name"><strong>峡谷开黑群</strong><small>7 位召唤师 · 王者峡谷集结中</small></div>
      <span class="more" aria-hidden="true">•••</span>
    </header>
    <div class="notice">🔥　排位车队 · 今晚不掉星 <span style="float:right">群公告　›</span></div>

    <section class="chat" id="chat" aria-live="polite" aria-label="聊天记录">
      <div class="time">—　今天 21:07　—</div>
      <article class="message" data-delay="500"><div class="avatar a1" aria-hidden="true">🐒</div><div class="message-content"><div class="sender">玄鸿<small>· 打野</small></div><div class="bubble">发烧了可绝望，别给我打电话呗，一接波子汽水电话都跑不了，抖音都看不了都得去看 B 站</div></div></article>
      <article class="message" data-delay="1400"><div class="avatar a2" aria-hidden="true">🦊</div><div class="message-content"><div class="sender">波子汽水<small>· 中路</small></div><div class="bubble">玄鸿不回消息，也不回电话，气死我了我真要跳了</div></div></article>
      <article class="message" data-delay="2300"><div class="avatar a3" aria-hidden="true">🐰</div><div class="message-content"><div class="sender">好多鱼<small>· 辅助</small></div><div class="bubble">等我一下，我打电话摇人问一下，你滚吧都不接可绝望</div></div></article>
      <article class="message right" data-delay="3200"><div class="avatar a4" aria-hidden="true">🐯</div><div class="message-content"><div class="sender">玻璃<small>· 对抗路</small></div><div class="bubble">耍起吧</div></div></article>
      <article class="message" data-delay="3900"><div class="avatar a5" aria-hidden="true">🐼</div><div class="message-content"><div class="sender">李<small>· 游走</small></div><div class="bubble">真</div></div></article>
      <article class="message right" data-delay="4500"><div class="avatar a6" aria-hidden="true">🐺</div><div class="message-content"><div class="sender">和<small>· 发育路</small></div><div class="bubble">还</div></div></article>
      <article class="message" data-delay="5100"><div class="avatar a7" aria-hidden="true">🐉</div><div class="message-content"><div class="sender">孙<small>· 队长</small></div><div class="bubble">针扣</div></div></article>
      <div class="ending" id="ending" hidden>✦　对话结束 · 全员进入王者峡谷　✦</div>
    </section>

    <footer class="composer">
      <div class="composer-row"><span class="icon" aria-hidden="true">◉</span><div class="input">说点什么，准备开黑…</div><span class="icon" aria-hidden="true">☺</span><button id="replay" type="button">重播</button></div>
      <div class="caption">VICTORY IS OURS · 召唤师峡谷在线</div>
    </footer>
  </main>

  <script>
    const chat = document.querySelector("#chat");
    const messages = [...document.querySelectorAll(".message")];
    const ending = document.querySelector("#ending");
    let timers = [];

    function playChat() {
      timers.forEach(clearTimeout);
      timers = [];
      messages.forEach(message => message.classList.remove("show"));
      ending.hidden = true;
      chat.scrollTop = 0;

      messages.forEach(message => {
        timers.push(setTimeout(() => {
          message.classList.add("show");
          chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
        }, Number(message.dataset.delay)));
      });

      timers.push(setTimeout(() => {
        ending.hidden = false;
        chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
      }, 5800));
    }

    document.querySelector("#replay").addEventListener("click", playChat);
    playChat();
  </script>
</body>
</html>
